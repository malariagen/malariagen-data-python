# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.1.8
    hooks:
      # Run the linter.
      - id: ruff
        args:
          - "--fix"
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      # Strip outputs, execution counts and volatile metadata (kernel
      # display name, language version — these change depending on
      # which local environment a notebook was last run under, not on
      # any real edit) from notebooks before they're committed, so
      # `git diff` only shows real cell-source changes.
      - id: nbstripout
        args:
          - "--extra-keys"
          - "metadata.kernelspec.display_name metadata.language_info.version"
